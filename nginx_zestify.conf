server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/octal-frontend;
    index index.html;

    server_name _;

    # Compression & Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Immutable caching for all Vite hashed assets (loads in 0ms on repeat visits)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Video streaming for login background
    location ~* \.(?:mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Admin SPA entry points (exact matches serve index.html with no-cache)
    location = /admin {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /admin/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # HTML entry point - revalidate with ETag for instant updates
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Direct high-performance static APK streaming
    location = /download/apk {
        alias /var/www/octal-frontend/OctalDialer.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="OctalDialer.apk"';
        add_header Accept-Ranges bytes;
        add_header Cache-Control 'public, max-age=300';
    }

    location = /OctalDialer.apk {
        alias /var/www/octal-frontend/OctalDialer.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="OctalDialer.apk"';
        add_header Accept-Ranges bytes;
        add_header Cache-Control 'public, max-age=300';
    }

    location = /download {
        return 302 /download/apk;
    }

    location = /download/ {
        return 302 /download/apk;
    }

    # WebSockets / Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    # Backend API namespaces
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
